name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore src/Slack.Webhooks.sln

      - name: Build
        run: dotnet build src/Slack.Webhooks.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test src/Slack.Webhooks.Tests/Slack.Webhooks.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=../../artifacts/coverlet-output

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on master
        shell: bash
        run: |
          git fetch origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: 10.x

      - name: Set package version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Slack.Webhooks/Slack.Webhooks.csproj

      - name: Pack
        run: >
          dotnet pack src/Slack.Webhooks/Slack.Webhooks.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e
        id: login
        with:
          user: mrb0nj

      - name: NuGet push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
